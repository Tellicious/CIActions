name: STM32 build

on:
  workflow_call:
    inputs:
      build-type:
        description: "CMake build type (e.g., Release, Debug, etc.)"
        required: true
        type: string
      target-branch:
        description: "Target branch to checkout and build"
        required: true
        type: string
    secrets:
      pat:
        description: "Personal Access Token for authentication"
        required: false

permissions:
  contents: read

concurrency:
  group: stm32-build-${{ github.repository }}-${{ inputs.target-branch }}-${{ inputs.build-type }}
  cancel-in-progress: true

jobs:
  STM32Build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y \
              build-essential \
              gcc-arm-none-eabi \
              binutils-arm-none-eabi \
              cmake ninja-build || { echo "::error::Failed to install build dependencies" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          submodules: 'recursive'
          fetch-depth: 1
          token: ${{ secrets.pat || secrets.GITHUB_TOKEN }}

      - name: Configure CMake
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
        run: |
          set -e
          cmake \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=${{ github.workspace }}/cmake/gcc-arm-none-eabi.cmake \
            -S ${{ github.workspace }} \
            -B ${{ github.workspace }}/build \
            -G Ninja || { echo "::error::CMake configuration failed" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Build
        run: |
          set -e
          build_log="${RUNNER_TEMP}/cmake-build.log"
          if ! cmake --build "${{ github.workspace }}/build" >"$build_log" 2>&1; then
            cat "$build_log" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Build failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
