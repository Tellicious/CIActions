name: Publish STM32 release with build artifacts

on:
  workflow_call:
    inputs:
      build-type:
        description: "CMake build type (e.g., Release, Debug, etc.)"
        required: true
        type: string
      target-branch:
        description: "Target branch to checkout and build"
        required: true
        type: string
      tag:
        description: "Target tag to release"
        required: true
        type: string
      release-name:
        description: "Name of the release"
        required: true
        type: string
      body-file:
        description: "Path to release body file"
        required: true
        type: string
    secrets:
      pat:
        description: "Personal Access Token for authentication"
        required: false

permissions:
  contents: write

concurrency:
  group: stm32-publish-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publishRelease:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
          set -e
          sudo apt-get update && sudo apt install -y \
          build-essential \
          gcc-arm-none-eabi \
          binutils-arm-none-eabi \
          cmake ninja-build || { echo "::error::Failed to install build dependencies" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target-branch }}
        submodules: 'recursive'
        fetch-depth: 0
        token: ${{ secrets.pat || secrets.GITHUB_TOKEN }}

    - name: Configure CMake
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        set -e
        cmake \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_TOOLCHAIN_FILE:FILEPATH=${{ github.workspace }}/cmake/gcc-arm-none-eabi.cmake \
          -S ${{ github.workspace }} \
          -B ${{ github.workspace }}/build \
          -G Ninja || { echo "::error::CMake configuration failed" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

    - name: Build
      run: |
        set -e
        build_log="${RUNNER_TEMP}/cmake-build.log"
        if ! cmake --build "${{ github.workspace }}/build" >"$build_log" 2>&1; then
          cat "$build_log" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Build failed" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Verify build artifacts exist
      env:
        BUILD_DIR: ${{ github.workspace }}/build
      run: |
        shopt -s nullglob
        files=("$BUILD_DIR"/*.bin)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::No .bin artifacts found in $BUILD_DIR" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "Found ${#files[@]} .bin artifact(s): ${files[*]}"

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.pat || secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_NAME: ${{ inputs.release-name }}
        BODY_FILE: ${{ inputs.body-file }}
        REPOSITORY: ${{ github.repository }}
        BUILD_DIR: ${{ github.workspace }}/build
      run: |
        set -e
        gh release create "$RELEASE_TAG" \
          --repo "$REPOSITORY" \
          --title "$RELEASE_NAME" \
          --notes-file "$BODY_FILE" \
          --latest \
          "$BUILD_DIR"/*.bin || { echo "::error::Failed to create GitHub release $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
